    <section class="formsection">
      <div>
        <h1>Full set of great features to make your product fresh</h1>

          goals, they help us to stay sharp.
        </p>
      </div>
      <form class="form">
        <div class="inputs">
          <input
            type="name"
            name="name"
            id="name"
            type="name"
            placeholder="Name"
          />
        </div>
        <div class="inputs">
          <input
            type="email"
            name="email"
            id="email"
            type="email"
            placeholder="Email"
          />
        </div>
        <div class="inputs">
          <input
            type="message"
            name="message"
            id="message"
            type="message"
            placeholder="Message"
          />
        </div>
        <button type="submit">Submit</button>
      </form>
    </section>
