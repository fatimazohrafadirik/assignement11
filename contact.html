  <body>
    <nav class="nav">

      <ul>
        <li><a href="./project.html">Projects</a></li>
        <li><a href="./contact.html">Contact</a></li>
      </ul>

    <section class="formsection">
      <div>

        </p>
      </div>
      <form class="form">
        <div class="inputs">
          <input
            type="name"
            name="name"
            id="name"

            placeholder="Name"
          />

        <div class="inputs">
          <input
            type="email"
            name="email"

            type="email"
            placeholder="Email"
          />

          <input
            type="message"
            name="message"
            id="message"
            type="message"
            placeholder="Message"
          />
        </div>
        <button type="submit">Submit</button>
      </form>
    </section>
    <nav class="nav">
      <img src="./images/Logo.png" alt="Logo" />
      <div class="navfooter">
        <ul>
          <li>Projects</li>
